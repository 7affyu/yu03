        class SoundManager {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            // 點擊茅草屋音效
            playClickHut() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            // 答對音效
            playCorrect() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                
                [523.25, 659.25, 783.99].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                    gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.25);
                });
            }

            // 答錯音效
            playIncorrect() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(140, now + 0.25);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            // 勝利音效
            playWin() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.12);
                    gain.gain.setValueAtTime(0.3, now + i * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.12);
                    osc.stop(now + i * 0.12 + 0.4);
                });
            }
        }

        const feedbackTitle = document.getElementById('feedback-title');
        const explanationText = document.getElementById('explanation-text');
        const btnNextQuestion = document.getElementById('btn-next-question');

        // 結算 Modal
        const resultModal = document.getElementById('result-modal');
        const resultCard = document.getElementById('result-card');
        const resultIconBg = document.getElementById('result-icon-bg');
        const resultIcon = document.getElementById('result-icon');
        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');
        const resultScore = document.getElementById('result-score');
        const resultActionContainer = document.getElementById('result-action-container');

        // ----------------------------------------------------
        // 4. 地圖渲染與茅草屋 SVG
        // ----------------------------------------------------
        function renderMapHuts() {
            hutsContainer.innerHTML = '';
            
            HUT_POSITIONS.forEach((pos, idx) => {
                const hutDiv = document.createElement('div');
                const isCompleted = answeredHuts[idx];
                const isCorrect = userAnswers[idx];

                hutDiv.className = `hut-item absolute w-24 h-24 md:w-28 md:h-28 flex flex-col items-center justify-center ${isCompleted ? 'completed' : 'hut-glow'}`;
                hutDiv.style.left = pos.left;
                hutDiv.style.top = pos.top;
                hutDiv.dataset.index = idx;

                // 茅草屋 SVG + 屋頂與完成標示 flag
                hutDiv.innerHTML = `
                    <div class="relative w-full h-full flex flex-col items-center justify-center">
                        <!-- 完成時顯示的答對/答錯旗幟 -->
                        ${isCompleted ? `
                            <div class="absolute -top-4 z-20 animate-bounce">
                                <span class="px-2 py-0.5 rounded-full text-xs font-black shadow-md ${isCorrect ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'}">
                                    ${isCorrect ? '<i class="fa-solid fa-check"></i> 答對' : '<i class="fa-solid fa-xmark"></i> 答錯'}
                                </span>
                            </div>
                        ` : `
                            <div class="absolute -top-3 z-10 bg-amber-400 text-amber-950 font-black text-[10px] px-2 py-0.5 rounded-full border border-amber-200 shadow-sm">
                                🏠 ${idx + 1}號屋
                            </div>
                        `}

                        <!-- 向量茅草屋形狀 -->
                        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">
                            <!-- 屋身 (土黃木頭質感) -->
                            <rect x="25" y="45" width="50" height="42" fill="#d4a373" stroke="#8c5a2b" stroke-width="3" rx="4"/>
                            <!-- 門 -->
                            <rect x="42" y="60" width="16" height="27" fill="#5c3d1e" rx="2"/>
                            <circle cx="54" cy="74" r="1.5" fill="#f4a261"/>
                            <!-- 茅草屋頂 (黃褐色金字塔形) -->
                            <polygon points="50,10 12,48 88,48" fill="#e9c46a" stroke="#b0892a" stroke-width="3" stroke-linejoin="round"/>
                            <polygon points="50,10 25,48 75,48" fill="#f4a261" opacity="0.4"/>
                            <!-- 屋頂茅草線條質感 -->
                            <line x1="50" y1="10" x2="30" y2="48" stroke="#946e19" stroke-width="1.5"/>
                            <line x1="50" y1="10" x2="70" y2="48" stroke="#946e19" stroke-width="1.5"/>
                        </svg>
                    </div>
                `;

                // 點擊茅草屋開啟問題
                hutDiv.addEventListener('click', () => {
                    if (!answeredHuts[idx]) {
                        sounds.playClickHut();
                        openQuestionModal(idx);
                    }
                });

                hutsContainer.appendChild(hutDiv);
            });
        }

        // ----------------------------------------------------
        // 5. 題目 Modal 邏輯
        // ----------------------------------------------------
        function openQuestionModal(hutIndex) {
            activeHutIndex = hutIndex;
            const qData = QUESTIONS[hutIndex];

            // 設置模態框內容
            modalHutBadge.innerHTML = `<i class="fa-solid fa-house-chimney mr-1"></i> 第 ${hutIndex + 1} 號茅草屋`;
            questionText.textContent = `${hutIndex + 1}. ${qData.question}`;
            
            // 清空並生成選項
            optionsContainer.innerHTML = '';
            explanationBox.classList.add('hidden');
            btnNextQuestion.classList.add('hidden');

            qData.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-3.5 md:p-4 rounded-2xl border-2 border-gray-200 bg-gray-50 hover:bg-pink-50 hover:border-pink-300 font-bold text-gray-700 text-sm md:text-base flex items-center justify-between shadow-sm`;
                btn.innerHTML = `
                    <span>${String.fromCharCode(65 + optIdx)}. ${optText}</span>
                    <i class="fa-regular fa-circle text-gray-300 text-lg"></i>
                `;

                btn.addEventListener('click', () => handleAnswerSelect(optIdx, btn));
                optionsContainer.appendChild(btn);
            });

            // 顯示 Modal
            questionModal.classList.remove('hidden');
            setTimeout(() => {
                questionModal.classList.remove('opacity-0');
                questionCard.classList.remove('scale-95');
                questionCard.classList.add('scale-100');
            }, 20);
        }

        // 處理玩家選擇答案
        function handleAnswerSelect(selectedOptionIdx, selectedBtn) {
            const qData = QUESTIONS[activeHutIndex];
            const isCorrect = (selectedOptionIdx === qData.answer);
            const allOptionBtns = optionsContainer.querySelectorAll('button');

            // 禁用所有按鈕防止重複點擊
            allOptionBtns.forEach(btn => btn.style.pointerEvents = 'none');

            // 標記該屋狀況
            answeredHuts[activeHutIndex] = true;
            userAnswers[activeHutIndex] = isCorrect;

            if (isCorrect) {
                correctAnswersCount++;
                sounds.playCorrect();
                selectedBtn.className = "option-btn w-full text-left p-3.5 md:p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 font-black text-emerald-800 text-sm md:text-base flex items-center justify-between shadow-md";
                selectedBtn.querySelector('i').className = "fa-solid fa-circle-check text-emerald-600 text-xl";

                feedbackTitle.className = "text-base font-black mb-1 flex items-center gap-2 text-emerald-700";
                feedbackTitle.innerHTML = `<i class="fa-solid fa-circle-check"></i> 回答正確！`;
                explanationBox.className = "p-4 rounded-2xl mb-5 text-sm font-bold border border-emerald-200 bg-emerald-50/70";
            } else {
                sounds.playIncorrect();
                selectedBtn.className = "option-btn w-full text-left p-3.5 md:p-4 rounded-2xl border-2 border-rose-400 bg-rose-50 font-black text-rose-800 text-sm md:text-base flex items-center justify-between shadow-md";
                selectedBtn.querySelector('i').className = "fa-solid fa-circle-xmark text-rose-500 text-xl";

                // 高亮標示正確答案
                const correctBtn = allOptionBtns[qData.answer];
                correctBtn.className = "option-btn w-full text-left p-3.5 md:p-4 rounded-2xl border-2 border-emerald-400 bg-emerald-50 font-bold text-emerald-800 text-sm md:text-base flex items-center justify-between";
                correctBtn.querySelector('i').className = "fa-solid fa-circle-check text-emerald-500 text-xl";

                feedbackTitle.className = "text-base font-black mb-1 flex items-center gap-2 text-rose-700";
                feedbackTitle.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> 回答錯誤！`;
                explanationBox.className = "p-4 rounded-2xl mb-5 text-sm font-bold border border-rose-200 bg-rose-50/70";
            }

            // 顯示解析說明
            explanationText.textContent = qData.explanation;
            explanationBox.classList.remove('hidden');
            btnNextQuestion.classList.remove('hidden');

            // 即時更新頂部分數顯示 (右上角要求)
            updateScoreHeader();
        }

        // 關閉問題 Modal 繼續遊戲
        btnNextQuestion.addEventListener('click', () => {
            questionModal.classList.add('opacity-0');
            questionCard.classList.add('scale-95');

            setTimeout(() => {
                questionModal.classList.add('hidden');
                renderMapHuts();

                // 檢查是否所有 10 題皆已答完
                const totalAnswered = answeredHuts.filter(Boolean).length;
                if (totalAnswered >= 10) {
                    checkGameCompletion();
                }
            }, 200);
        });

        // ----------------------------------------------------
        // 6. 更新 Header 分數與答題進度
        // ----------------------------------------------------
        function updateScoreHeader() {
            const answeredTotal = answeredHuts.filter(Boolean).length;
            progressText.textContent = `${answeredTotal} / 10`;
            scoreText.textContent = `${correctAnswersCount} / 10`;
        }

        // ----------------------------------------------------
        // 7. 全部位做答完畢與結算檢查 (規則需求)
        // ----------------------------------------------------
        function checkGameCompletion() {
            // 答對題數如果小於 8 題 vs 大於等於 8 題
            const isPassed = correctAnswersCount >= 8;

            if (isPassed) {
                sounds.playWin();
                resultCard.className = "bg-white rounded-3xl p-8 max-w-md w-[90%] text-center shadow-2xl border-4 border-emerald-400 relative overflow-hidden";
                resultIconBg.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner border-2 bg-emerald-100 text-emerald-600 border-emerald-300";
                resultIcon.className = "fa-solid fa-trophy";
                resultTitle.textContent = "挑戰成功！恭喜通關！";
                resultDesc.textContent = "太棒了！您具備極佳的 SDG 5 性別平權觀念，成功通過村莊的性別平權考驗！";
                resultScore.className = "text-2xl font-black text-emerald-600";
                
                // 按鈕需求：大於等於 8 題，出現前往下一關的畫面與連結到「下一關」按鈕 (level2.html)
                resultActionContainer.innerHTML = `
                    <a href="level2.html" class="block w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3.5 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all active:scale-95 text-lg">
                        前往下一關 <i class="fa-solid fa-circle-arrow-right ml-1"></i>
                    </a>
                `;
            } else {
                resultCard.className = "bg-white rounded-3xl p-8 max-w-md w-[90%] text-center shadow-2xl border-4 border-rose-400 relative overflow-hidden";
                resultIconBg.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner border-2 bg-rose-100 text-rose-600 border-rose-300";
                resultIcon.className = "fa-solid fa-rotate-right";
                resultTitle.textContent = "挑戰未通過！";
                resultDesc.textContent = "答對題數未達 8 題標準喔！別氣餒，再複習一下性別平權觀念並重新挑戰吧！";
                resultScore.className = "text-2xl font-black text-rose-600";

                // 按鈕需求：答對題數小於 8 題，出現重新挑戰的訊息與「重新挑戰」按鈕，讓使用者重新載入第一頁網頁
                resultActionContainer.innerHTML = `
                    <button onclick="window.location.reload()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-black py-3.5 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all active:scale-95 text-lg">
                        <i class="fa-solid fa-rotate-right mr-1"></i> 重新挑戰
                    </button>
                `;
            }

            resultScore.textContent = `${correctAnswersCount} / 10`;

            // 顯示結算 Modal
            setTimeout(() => {
                resultModal.classList.remove('hidden');
                setTimeout(() => {
                    resultModal.classList.remove('opacity-0');
                }, 50);
            }, 300);
        }

        // ----------------------------------------------------
        // 8. 遊戲初始啟動
        // ----------------------------------------------------
        window.onload = () => {
            renderMapHuts();
            updateScoreHeader();
        };
    </script>
</body>
</html>
